# Stand-alone test program for old Intel Macs (OS X 10.5 - 10.11): see docs/MACOS_LEGACY.md.
# Its own workspace on purpose, so the main Cargo.toml and Cargo.lock are never touched.
[package]
name = "litecord-legacy-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[workspace]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
litecord-legacy-compat = { path = "../compat" }
# The same async and HTTP crates the legacy edition uses.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"

[profile.release]
opt-level = 2
debug = 1
